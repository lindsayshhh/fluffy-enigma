<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Overhead — what's flying above you</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#1c7ed6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Overhead" />
</head>
<body>
  <main class="page">
    <div class="widget" id="widget">
      <header class="widget__header">
        <span class="widget__title">✈️ Overhead</span>
        <button class="widget__refresh" id="refreshBtn" title="Refresh now" aria-label="Refresh">⟳</button>
      </header>

      <div class="widget__body" id="body">
        <div class="state state--loading">
          <p>Finding your location…</p>
        </div>
      </div>

      <section class="acars" id="acars" hidden>
        <div class="acars__header">
          <span class="acars__title">Recent ACARS</span>
          <span class="acars__meta" id="acarsMeta"></span>
        </div>
        <div class="acars__body" id="acarsBody"></div>
      </section>

      <footer class="widget__footer">
        <span id="footerText">Waiting for location</span>
      </footer>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
