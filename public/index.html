<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Overhead — what's flying above you</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#1c7ed6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Overhead" />
</head>
<body>
  <main class="page">
    <div class="cabin">
      <div class="shade" aria-hidden="true"></div>

      <div class="window">
        <div class="pane">
          <div class="sky" id="sky" aria-hidden="true">
            <span class="sky__body"></span>
            <span class="cloud cloud--a"></span>
            <span class="cloud cloud--b"></span>
            <span class="cloud cloud--c"></span>
          </div>

          <div class="pane__content" id="body">
            <div class="state">
              <p>Finding your location…</p>
            </div>
          </div>

          <div class="pane__glare" aria-hidden="true"></div>
        </div>
        <span class="window__vent" aria-hidden="true"></span>
      </div>

      <div class="placard">
        <div class="placard__head">
          <span class="placard__title">Overhead</span>
          <button class="placard__refresh" id="refreshBtn" title="Refresh now" aria-label="Refresh">⟳</button>
        </div>
        <div class="placard__stats" id="stats"></div>
        <div class="placard__footer"><span id="footerText">Waiting for location</span></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
