services:
  - type: web
    name: overhead
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: npm start
  - type: web
    name: lastlie
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: npm run start:lastlie
    envVars:
      # Set in the Render dashboard; without it the site serves the curated list.
      - key: FACTCHECK_API_KEY
        sync: false
