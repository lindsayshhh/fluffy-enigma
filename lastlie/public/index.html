<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Lie</title>
<meta name="description" content="The most recent claim by Donald Trump that a news organization has published a fact-check on, with a link to the fact-check.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tv">
  <div class="screen">
    <main id="stage" class="broadcast" aria-live="polite">
      <p class="loading">Tuning in…</p>
    </main>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="roll" aria-hidden="true"></div>
    <div class="glare" aria-hidden="true"></div>
  </div>
  <div class="cabinet">
    <span class="plate">The Last Lie</span>
    <span class="grille" aria-hidden="true"></span>
    <span class="knobs" aria-hidden="true"><i></i><i></i></span>
  </div>
</div>

<template id="tpl-latest">
  <div class="status">
    <span class="ch">CH 45</span>
    <span class="live"><i class="rec" aria-hidden="true"></i>On the air</span>
    <span class="clock" data-slot="clock"></span>
  </div>
  <p class="eyebrow" data-slot="eyebrow"></p>
  <blockquote class="claim" data-slot="claim"></blockquote>
  <p class="attribution">
    <span data-slot="venue"></span><span class="sep" aria-hidden="true">·</span><time data-slot="date"></time>
  </p>
  <section class="lower-third">
    <h2 data-slot="verdict-label"></h2>
    <p class="verdict"><span class="rating" data-slot="rating"></span><span data-slot="verdict-by"></span></p>
    <p data-slot="reality"></p>
    <p class="source">Fact-checked by <a data-slot="source" rel="noopener noreferrer" target="_blank"></a></p>
  </section>
</template>

<footer>
  <details id="archive">
    <summary>Previously on this channel</summary>
    <ol id="archive-list"></ol>
  </details>
  <p class="disclaimer" id="disclaimer"></p>
</footer>

<script src="app.js" type="module"></script>
</body>
</html>
